<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimal robot mascot">
  <!-- antenna -->
  <line x1="60" y1="18" x2="60" y2="34" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="14" r="6" fill="#6366F1"/>
  <!-- ears -->
  <rect x="16" y="54" width="9" height="20" rx="4.5" fill="#64748B"/>
  <rect x="95" y="54" width="9" height="20" rx="4.5" fill="#64748B"/>
  <!-- head -->
  <rect x="24" y="34" width="72" height="56" rx="18" fill="#E2E8F0" stroke="#64748B" stroke-width="4"/>
  <!-- eyes -->
  <circle cx="45" cy="60" r="7.5" fill="#6366F1"/>
  <circle cx="75" cy="60" r="7.5" fill="#6366F1"/>
  <!-- mouth -->
  <rect x="45" y="75" width="30" height="5" rx="2.5" fill="#64748B"/>
  <!-- body hint -->
  <rect x="37" y="94" width="46" height="20" rx="9" fill="#E2E8F0" stroke="#64748B" stroke-width="4"/>
</svg>
